name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test (Forge + Fabric)
        run: ./gradlew build --no-daemon
      - name: Keep the jars
        uses: actions/upload-artifact@v4
        with:
          name: keybindpresets-jars
          path: |
            forge/build/libs/keybindpresets-forge-*.jar
            fabric/build/libs/keybindpresets-fabric-*.jar
            !**/*-sources.jar
            !**/*-javadoc.jar
          if-no-files-found: error
